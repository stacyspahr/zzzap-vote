<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Surge page, option C: Floating Cards</title>
<link rel="stylesheet" href="mock.css">
<style>
  /* C: Floating Cards, like an artist page in Apple Music. The name sits
     on the photo with a Vote button beside it. Scrolling up, the photo
     melts into a soft blur of its own colors, and the information floats
     over it in separate glass cards. */
  .photo img {
    transform: scale(calc(1.04 + var(--p) * .12));
    filter: blur(calc(var(--p) * 26px)) brightness(calc(1 - var(--p) * .3)) saturate(calc(1 + var(--p) * .4));
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.3) 0%, transparent 15%, transparent 45%, rgba(0,0,0,.6) 64%, rgba(0,0,0,.25) 100%);
  }
  .top {
    height: 64svh;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
    padding: 0 20px 22px;
  }
  h1 { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: .95; }
  .handle { color: var(--dim); font-size: 15px; margin-top: 8px; }
  .vote-btn { padding: 13px 24px; font-size: 16px; box-shadow: 0 8px 30px rgba(255,214,10,.25); }
  .cards { display: flex; flex-direction: column; gap: 12px; padding: 0 12px; }
  .glass {
    padding: 18px;
    border-radius: 26px;
    background: rgba(28,28,36,.5);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    backdrop-filter: blur(30px) saturate(160%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.25);
  }
  .question { font-size: 21px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; margin: 12px 0 6px; }
  .hint { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .about .row { display: flex; align-items: center; justify-content: space-between; }
  .tag { font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 100px; background: rgba(255,255,255,.1); }
  .bio { white-space: pre-line; font-size: 15.5px; line-height: 1.45; color: rgba(245,245,247,.88); margin: 12px 0 16px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .archive .past { padding: 15px 0; border-top: 1px solid var(--hair); }
  .archive .past:first-of-type { border-top: 0; padding-top: 10px; }
</style>
</head>
<body>
<div class="photo"><img data-photo alt=""></div>
<div class="status-scrim"></div>
<div class="col content">
  <section class="top">
    <div>
      <h1 data-fill="name"></h1>
      <div class="handle" data-fill="handle"></div>
    </div>
    <a class="btn vote-btn" href="#" data-scrollto="vote">Vote</a>
  </section>

  <div class="cards">
    <div class="glass" id="vote">
      <div class="live-row"><span class="live-pill"><span class="dot"></span>LIVE</span><span class="ends" data-fill="ends"></span></div>
      <div class="question" data-fill="question"></div>
      <div class="hint">Results show after you vote.</div>
      <div class="options" data-ballot="c"></div>
      <div class="meta" data-meta="c"></div>
      <div class="get hidden">
        <div><div class="t1">Don't miss the next one</div><div class="t2">Get Zzzap and Stacy's next question lands on your Lock Screen.</div></div>
        <a class="btn" href="#">Get Zzzap</a>
      </div>
    </div>

    <div class="glass about">
      <div class="row"><span class="label">About</span><span class="tag" data-fill="category"></span></div>
      <p class="bio" data-fill="bio"></p>
      <div class="links"><div class="socials" data-socials></div><a class="site" href="#" data-fill="website"></a></div>
    </div>

    <div class="glass archive">
      <div class="label">Past zzzaps</div>
      <div data-past></div>
    </div>
  </div>
  <footer><b>Zzzap</b>Privacy &nbsp; Terms</footer>
</div>
<nav class="switch"><a href="./">All</a><a href="a.html">A</a><a href="b.html">B</a><a class="on" href="c.html">C</a></nav>
<script src="mock.js"></script>
</body>
</html>
