<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Surge page, option A: Glass Sheet</title>
<link rel="stylesheet" href="mock.css">
<style>
  /* A: Glass Sheet. The photo fills the screen and stays put. A frosted
     sheet starts halfway down and slides up over it like an iPhone sheet;
     the photo softly dims and blurs behind it. */
  /* Smooth on iPhone: nothing is re-blurred while you scroll. A blurred
     copy of the photo fades in over the sharp one, and a black layer fades
     in to dim it. Only opacity and a gentle zoom change, which the phone
     does on its graphics chip. */
  .photo .layers {
    position: absolute; inset: 0;
    transform: scale(calc(1.02 + var(--p) * .06));
    will-change: transform;
  }
  .photo .layers img { position: absolute; inset: 0; }
  .photo .soft { opacity: var(--p); will-change: opacity; }
  .photo .shade { position: absolute; inset: 0; background: #000; opacity: calc(var(--p) * .4); will-change: opacity; }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.3) 0%, transparent 16%, transparent 42%, rgba(0,0,0,.45) 60%);
  }
  .clear { height: 52svh; }
  .sheet {
    min-height: 100svh;
    padding: 10px 20px 0;
    border-radius: 32px 32px 0 0;
    background: rgba(18,18,24,.6);
    -webkit-backdrop-filter: blur(40px) saturate(170%);
    backdrop-filter: blur(40px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 -24px 60px rgba(0,0,0,.35);
  }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); margin: 0 auto 20px; }
  .who { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { font-size: 36px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
  .handle { color: var(--dim); font-size: 15px; margin-top: 6px; }
  .tag {
    flex-shrink: 0; font-size: 12.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 100px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14);
  }
  .bio { white-space: pre-line; font-size: 15.5px; line-height: 1.45; color: rgba(245,245,247,.86); margin-top: 14px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .live {
    margin-top: 24px; padding: 18px 16px 16px;
    border-radius: 24px;
    background: rgba(255,255,255,.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .question { font-size: 21px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; margin: 12px 0 6px; }
  .hint { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .label { margin: 30px 0 12px; }
  .archive { display: flex; flex-direction: column; }
  .past { padding: 15px 0; border-top: 1px solid var(--hair); }
</style>
</head>
<body>
<div class="photo"><div class="layers"><img data-photo alt=""><img class="soft" src="header-soft.jpg" alt=""><div class="shade"></div></div></div>
<div class="status-scrim"></div>
<div class="col content">
  <div class="clear"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="who">
      <div>
        <h1 data-fill="name"></h1>
        <div class="handle" data-fill="handle"></div>
      </div>
      <span class="tag" data-fill="category"></span>
    </div>
    <p class="bio" data-fill="bio"></p>
    <div class="links"><div class="socials" data-socials></div><a class="site" href="#" data-fill="website"></a></div>

    <div class="live" id="vote">
      <div class="live-row"><span class="live-pill"><span class="dot"></span>LIVE</span><span class="ends" data-fill="ends"></span></div>
      <div class="question" data-fill="question"></div>
      <div class="hint">Results show after you vote.</div>
      <div class="options" data-ballot="a"></div>
      <div class="meta" data-meta="a"></div>
      <div class="get hidden">
        <div><div class="t1">Don't miss the next one</div><div class="t2">Get Zzzap and Stacy's next question lands on your Lock Screen.</div></div>
        <a class="btn" href="#">Get Zzzap</a>
      </div>
    </div>

    <div class="label">Past zzzaps</div>
    <div class="archive" data-past></div>
    <footer><b>Zzzap</b>Privacy &nbsp; Terms</footer>
  </div>
</div>
<nav class="switch"><a href="./">All</a><a class="on" href="a.html">A</a><a href="b.html">B</a><a href="c.html">C</a></nav>
<script src="mock.js"></script>
</body>
</html>
