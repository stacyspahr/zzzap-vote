<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Surge page, option B: Magazine</title>
<link rel="stylesheet" href="mock.css?v=3">
<style>
  /* B: Magazine. No boxes. Big type sits right on the photo like a cover;
     as you scroll, the photo fades to black behind the words, and the
     rest reads like an article: hairlines, numbers, a quote. */
  .photo img {
    transform: scale(calc(1 + var(--p) * .04));
    filter: brightness(calc(1 - var(--p) * .78));
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, transparent 14%, transparent 40%, rgba(5,5,7,.62) 66%, rgba(5,5,7,.94) 100%);
  }
  .cover {
    min-height: 100svh;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 24px 34px;
  }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 72px; font-weight: 800; letter-spacing: -.045em; line-height: .9; margin-top: 10px; }
  .handle { color: var(--dim); font-size: 15px; margin-top: 10px; }
  .teaser {
    margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.22);
    display: block; color: inherit; text-decoration: none;
  }
  .teaser .question { font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; margin-top: 10px; }
  .teaser .go { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .teaser .go span { font-size: 13px; color: var(--dim); }

  .body { padding: 0 24px; }
  .ballot { padding: 34px 0 10px; }
  .ballot .question { font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; margin: 12px 0 20px; }
  /* Answers as rows on hairlines, not buttons in boxes. */
  .ballot .options { gap: 0; }
  .ballot .option {
    background: none; border: 0; border-radius: 0;
    border-top: 1px solid var(--hair);
    padding: 19px 2px; font-size: 18px; font-weight: 600;
  }
  .ballot .option:last-child { border-bottom: 1px solid var(--hair); }
  .ballot .option .fill { top: auto; height: 3px; bottom: -1px; border-radius: 2px; }
  .ballot .results .option.lead .fill { background: var(--green); }
  .ballot .results .option.mine { border-color: var(--hair); }
  .ballot .results .option.mine .otext { color: var(--yellow); }
  .ballot .hint { font-size: 13px; color: var(--dim); margin-top: 14px; }
  .quote {
    font-family: ui-serif, "New York", Georgia, serif;
    font-size: 25px; line-height: 1.35; font-style: italic; font-weight: 400;
    white-space: pre-line; color: rgba(245,245,247,.92);
    padding: 40px 0 20px;
  }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .label { margin: 44px 0 6px; }
  .past { display: flex; gap: 16px; padding: 18px 0; border-top: 1px solid var(--hair); }
  .past .num { font-size: 13px; font-weight: 700; color: var(--dimmer); font-variant-numeric: tabular-nums; padding-top: 3px; }
  .past .pbody { flex: 1; }
  .past .q { font-size: 17px; }
</style>
</head>
<body>
<div class="photo"><img data-photo alt=""></div>
<div class="status-scrim"></div>
<div class="col content">
  <section class="cover">
    <div class="kicker"><span data-fill="category"></span> &nbsp; on Surge</div>
    <h1 data-fill="name"></h1>
    <div class="handle" data-fill="handle"></div>
    <a class="teaser" href="#" data-scrollto="vote">
      <div class="live-row"><span class="live-pill"><span class="dot"></span>LIVE NOW</span><span class="ends" data-fill="ends"></span></div>
      <div class="question" data-fill="question"></div>
      <div class="go"><span>Results show after you vote.</span><span class="btn">Vote</span></div>
    </a>
  </section>

  <div class="body">
    <section class="ballot" id="vote">
      <div class="label">Your vote</div>
      <div class="question" data-fill="question"></div>
      <div class="options" data-ballot="b"></div>
      <div class="meta" data-meta="b"></div>
      <div class="get hidden">
        <div><div class="t1">Don't miss the next one</div><div class="t2">Get Zzzap and Stacy's next question lands on your Lock Screen.</div></div>
        <a class="btn" href="#">Get Zzzap</a>
      </div>
    </section>

    <p class="quote" data-fill="bio"></p>
    <div class="links"><div class="socials" data-socials></div><a class="site" href="#" data-fill="website"></a></div>

    <div class="label">Past zzzaps</div>
    <div data-past="numbered"></div>
    <footer><b>Zzzap</b>Privacy &nbsp; Terms</footer>
  </div>
</div>
<nav class="switch"><a href="./">All</a><a href="a.html">A</a><a class="on" href="b.html">B</a><a href="c.html">C</a></nav>
<script src="mock.js?v=3"></script>
</body>
</html>
