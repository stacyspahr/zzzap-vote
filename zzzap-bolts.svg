<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 100 88" role="img" aria-label="Zzzap">
  <!-- Static Zzzap double-bolt mark. Same polygons and colors as the animated
       logo on zzzap-app.com (from zap/zap/ZzzapLogoAnimation.html), resting state. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08C00"/>
      <stop offset="1" stop-color="#FFE84D"/>
    </linearGradient>
    <radialGradient id="s">
      <stop offset="0" stop-color="#FFF7CC" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD84D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <polygon points="5.25,17.77 43.75,54.97 30.83,60.99 50.00,94.00 11.50,56.80 24.42,50.78" fill="url(#b)"/>
  <polygon points="94.75,17.77 56.25,54.97 69.17,60.99 50.00,94.00 88.50,56.80 75.58,50.78" fill="url(#b)"/>
  <circle cx="50" cy="94" r="6" fill="url(#s)"/>
</svg>
