<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Creator Demos · Zzzap</title>
<style>
  :root {
    --yellow: #FFD60A;
    --bg: #0a0a0f;
    --card: #16161d;
    --card2: #1d1d26;
    --text: #f5f5f7;
    --dim: #9a9aa3;
    --dimmer: #55555e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 56px 20px 40px;
    display: flex;
    flex-direction: column;
  }
  .bolts { color: var(--yellow); font-size: 30px; letter-spacing: -8px; text-align: center; }
  h1 {
    font-family: -apple-system, "SF Pro Display", sans-serif;
    font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
    text-align: center; margin-top: 14px;
  }
  .sub { color: var(--dim); font-size: 14px; text-align: center; margin-top: 6px; line-height: 1.4; }
  .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
  a.demo {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid #23232c;
    border-radius: 20px;
    padding: 18px;
    text-decoration: none; color: var(--text);
    transition: transform .12s ease, border-color .15s ease;
  }
  a.demo:active { transform: scale(.98); }
  a.demo:hover { border-color: rgba(255,214,10,.35); }
  .emoji {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--card2);
    border: 1px solid #26262f;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .txt { flex: 1; min-width: 0; }
  .cat {
    color: var(--yellow); font-size: 11.5px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .who { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .go { color: var(--dimmer); font-size: 20px; font-weight: 300; }
  footer {
    margin-top: auto;
    text-align: center;
    padding-top: 40px;
    color: var(--dimmer);
  }
  .tagline { font-size: 13px; font-weight: 600; color: var(--dim); }
  .legal { font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="phone">
  <div class="bolts">&#9889;&#9889;</div>
  <h1>Creator Demos</h1>
  <div class="sub">What a Zzzap creator page looks like.<br>Tap one, then vote to see the whole flow.</div>

  <div class="cards">
    <a class="demo" href="/demofitness/">
      <span class="emoji">&#128170;</span>
      <span class="txt">
        <span class="cat">Fitness</span>
        <div class="who">Maya Reeves</div>
        <div class="note">Trainer and coach</div>
      </span>
      <span class="go">&#8250;</span>
    </a>
    <a class="demo" href="/demogolf/">
      <span class="emoji">&#9971;</span>
      <span class="txt">
        <span class="cat">Golf</span>
        <div class="who">Marcus Reid</div>
        <div class="note">PGA teaching pro</div>
      </span>
      <span class="go">&#8250;</span>
    </a>
    <a class="demo" href="/demoartist/">
      <span class="emoji">&#127912;</span>
      <span class="txt">
        <span class="cat">Artist</span>
        <div class="who">Jason Prouty</div>
        <div class="note">Garage31 &middot; murals and airbrush</div>
      </span>
      <span class="go">&#8250;</span>
    </a>
  </div>

  <footer>
    <div class="tagline">Trusted Sources. Real Decisions.</div>
    <div class="legal">Zzzap by Rhapsy LLC</div>
  </footer>
</div>
</body>
</html>
