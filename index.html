<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zzzap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 17px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 48px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
    }

    .badge:hover {
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div class="logo">Zzzap ⚡</div>
  <div class="tagline">Web voting is coming soon.</div>
  <a class="badge" href="https://apps.apple.com/app/zzzap" target="_blank">
    Download Zzzap on the App Store
  </a>
</body>
</html>
