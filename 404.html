<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<!-- Surge pages stay out of search until launch. -->
<meta name="robots" content="noindex">
<title>Zzzap</title>
<!-- GitHub Pages can't make a preview per page, so links share this one. -->
<meta property="og:title" content="Vote on Zzzap">
<meta property="og:description" content="Trusted Sources. Real Decisions. Tap an answer, see what everyone picked.">
<meta property="og:site_name" content="Zzzap">
<!-- Bump ?v= on both lines whenever surge.js or surge.css changes, so browsers drop their cached copy. -->
<!-- Safari's own Zzzap banner: iPhone shows "Open" if the app is installed,
     "Get" if not (the page itself can't tell). app-argument hands the app this
     page's address, so "Open" lands on this profile. Safari only; in-app
     browsers like Instagram's skip it, which is what "Open in the app" is for. -->
<meta name="apple-itunes-app" content="app-id=6761918562">
<script>
  document.querySelector('meta[name="apple-itunes-app"]').content =
    "app-id=6761918562, app-argument=" + location.origin + location.pathname;
</script>
<link rel="stylesheet" href="/surge/surge.css?v=202610251200">
</head>
<body>
<!-- Every vote.zzzap-app.com/@handle address lands here (no server), and
     surge.js fills in that Surge account's page. -->
<div class="status-scrim"></div>
<div class="phone" id="page"></div>
<script src="/surge/surge.js?v=202610251200"></script>
</body>
</html>
